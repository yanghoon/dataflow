workflow:
  jobs:
    # 1. 일반 워크플로우(WORKFLOW 엔진) 샘플
    sample-workflow-job:
      job-name: "Sample Workflow Job"
      group: "sample_group"
      engine: "WORKFLOW"
      cron-expression: "0 0 * * * ?"
      enabled: true
      workflow-type: "CUSTOM_WORKFLOW"
      where:
        url: "http://example.com/api"
        method: "GET"

    # 2. 스프링 배치(SPRING_BATCH 엔진) 샘플
    sample-batch-job:
      job-name: "Sample Spring Batch Job"
      group: "batch_group"
      engine: "SPRING_BATCH"
      cron-expression: "0 0 2 * * ?"
      enabled: false
      spring-batch-job-name: "dailyReportJob"
      where:
        param1: "value1"
        param2: "value2"
