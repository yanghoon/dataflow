# Lakehouse 변환 파이프라인(silver → gold → 검사)을 System Type 하나에 대해 실행하는 공통 워크플로.
# 직접 실행하지 않는다. lakehouse-<system_type>.yml 이 부른다(ADR lakehouse/0006, 가이드 lakehouse/docs/github-actions.md).
# bronze 는 만들지 않는다(_sample/ 은 돌리지 않는다).
#
# 환경 변수 우선순위(나중 것이 이긴다):
#   1. pipeline/_init/*.sql 기본값(값이 없으면 로컬 디스크 s3-local)
#   2. gh 저장소 시크릿·변수(연결 정보: S3_*, PG_*)
#   3. 호출 파일의 env 입력(KEY=VALUE 줄)
name: _lakehouse-pipeline

on:
  workflow_call:
    inputs:
      system_type:
        description: "System Type. pipeline/<system_type>/ 폴더 이름"
        required: true
        type: string
      files:
        description: "pipeline/<system_type>/ 안에서 고를 SQL 와일드카드. 비우면 *.sql"
        required: false
        type: string
        default: "*.sql"
      env:
        description: "KEY=VALUE 줄(따옴표 없이). 빈 줄과 # 줄은 건너뛴다. 같은 키는 gh 시크릿·변수를 덮는다"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: [self-hosted]
    # 라벨로 러너를 고르려면 위 줄 대신 쓴다(가이드 2.3):
    # runs-on: [self-hosted, <label>]
    concurrency:
      group: lakehouse-${{ inputs.system_type }}
      cancel-in-progress: false   # 겹치면 기다린다. 대기 자리는 하나뿐이다
    env:
      # 연결 정보. 등록하지 않은 값은 빈 문자열이 되고, _init/*.sql 이 기본값을 쓴다
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_URL_STYLE: ${{ vars.S3_URL_STYLE }}
      S3_USE_SSL: ${{ vars.S3_USE_SSL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_KEY_ID: ${{ secrets.S3_SECRET_KEY_ID }}
      PG_HOST: ${{ vars.PG_HOST }}
      PG_PORT: ${{ vars.PG_PORT }}
      PG_DATABASE: ${{ vars.PG_DATABASE }}
      PG_USER: ${{ vars.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      SYSTEM_TYPE: ${{ inputs.system_type }}
      FILES: ${{ inputs.files }}
      PIPELINE_ENV: ${{ inputs.env }}
    defaults:
      run:
        shell: bash
        working-directory: lakehouse
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false   # 로컬 실행(s3-local) 데이터가 실행 사이에 남게 한다(가이드 4)

      - name: Run pipeline
        run: |
          set -euo pipefail

          if [[ ! "$SYSTEM_TYPE" =~ ^[a-z0-9_]+$ ]] || [ ! -d "pipeline/$SYSTEM_TYPE" ]; then
            echo "::error::system_type 이 잘못되었다: $SYSTEM_TYPE"
            exit 2
          fi
          # run.sh 는 pipeline/.env 를 읽어 환경 변수를 덮는다. 러너에 남은 .env 가 우선순위를 깨지 않게 막는다
          if [ -f pipeline/.env ]; then
            echo "::error::러너 작업 폴더에 lakehouse/pipeline/.env 가 있다. 지우고 다시 실행한다"
            exit 2
          fi

          # 호출 파일의 env 입력을 export 한다(gh 시크릿·변수를 덮는다)
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"   # 앞 공백 제거
            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue
            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env 입력 줄이 KEY=VALUE 가 아니다: ${line%%=*}"
              exit 2
            fi
            export "$line"
            echo "env: ${line%%=*}"
          done <<< "$PIPELINE_ENV"

          root="${DATA_ROOT:-s3-local}"
          echo "DATA_ROOT=$root"
          echo "INIT_FILES=${INIT_FILES:-pipeline/_init/base.sql}"
          # 로컬 디스크에서는 DuckDB COPY 가 상위 폴더를 만들지 않는다(S3에서는 필요 없음)
          if [[ "$root" != s3://* ]]; then
            mkdir -p "$root/silver/$SYSTEM_TYPE" "$root/gold/$SYSTEM_TYPE"
          fi

          shopt -s nullglob
          files=( pipeline/"$SYSTEM_TYPE"/${FILES:-*.sql} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::고른 SQL 파일이 없다: pipeline/$SYSTEM_TYPE/${FILES:-*.sql}"
            exit 2
          fi
          pipeline/run.sh "${files[@]}"
