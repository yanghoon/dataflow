# alpha config 와 함께 쓰는 나머지(레거시) 옵션. provider/upstream/header 관련 옵션은 alpha.yaml 로 간다.
email_domains = ["example.com"]
redirect_url = "http://kestra.localtest.me:4180/oauth2/callback"

cookie_name = "_oauth2_proxy"
cookie_secure = false          # 로컬 http 검증용. 운영은 true(HTTPS)
cookie_samesite = "lax"
skip_provider_button = true    # 로그인 버튼 화면 없이 바로 IdP 로 보낸다

# 감사 로그(프록시 계층). 기본 포맷에 Username(=OIDC email) 이 포함된다.
request_logging = true
auth_logging = true
standard_logging = true

# 외부 시스템이 호출하는 Kestra webhook trigger 만 OIDC 없이 통과시킨다.
skip_auth_routes = ["POST=^/api/v1/[^/]+/executions/webhook/"]
