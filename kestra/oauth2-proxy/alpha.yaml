server:
  bindAddress: "0.0.0.0:4180"

upstreamConfig:
  upstreams:
    - id: kestra
      path: /
      uri: http://kestra:8080/
      passHostHeader: true
      proxyWebSockets: true

injectRequestHeaders:
  # Kestra OSS 의 공개 동작: API 는 "Authorization: Basic" 헤더를 받아들인다.
  # 공용 Basic 자격증명은 프록시만 알고, 클라이언트가 보낸 Authorization 은 제거된다.
  - name: Authorization
    values:
      - secretSource:
          fromEnv: KESTRA_BASIC_AUTH_HEADER
  # 감사 로그용 실제 사용자. 클라이언트가 같은 이름의 헤더를 보내도 제거 후 덮어쓴다.
  - name: X-Forwarded-Email
    values:
      - claimSource:
          claim: email
  - name: X-Forwarded-User
    values:
      - claimSource:
          claim: user

injectResponseHeaders:
  # Kestra UI 는 document.cookie 의 "kestraBasicAuthenticated=true" 로 로그인 여부를 판단한다.
  # 프록시가 응답마다 이 플래그를 세팅해 UI 의 Basic 로그인 화면을 건너뛴다.
  # 주의: v7.15.6 에서 응답 헤더의 secretSource.value 는 base64 디코딩되지 않고 그대로 나간다(검증됨).
  # 그래서 fromEnv 로 평문을 넣는다.
  #
  # CSRF 재활성화: Kestra CsrfTokenFilter 는 "BASIC_AUTH 또는 JWT 쿠키가 있는가"만 보고 CSRF 를 강제한다.
  # Authorization 헤더 주입만 하면 브라우저 요청도 CSRF 검사가 꺼지므로(같은 site 서브도메인발 CSRF 성립, 검증됨),
  # 인증에 쓰이지 않는 더미 JWT 쿠키를 심어 브라우저 요청에 CSRF 토큰 검사를 되살린다.
  # (같은 이름의 헤더는 한 번만 선언 가능 → 한 헤더에 값 두 개. 각 값은 별도 Set-Cookie 줄로 나간다)
  - name: Set-Cookie
    values:
      - secretSource:
          fromEnv: KESTRA_UI_FLAG_COOKIE
      - secretSource:
          fromEnv: KESTRA_CSRF_MARKER_COOKIE

providers:
  - id: dex
    provider: oidc
    clientID: kestra
    clientSecret: kestra-oidc-secret   # 로컬 검증용. 운영은 clientSecretFile + ESO
    oidcConfig:
      issuerURL: http://dex.localtest.me:5556/dex
      emailClaim: email
      audienceClaims: [aud]
