# Gerrit Account·Project·Group 전체를 받아 스트림마다 S3 브론즈에 올린다. ADR: docs/adr/airbyte/0005
# 파일 규칙 B1~B7, 구현 요구 IR·IG. 스크립트는 컨테이너에 마운트한 _files/gerrit/gerrit.py(표준 라이브러리, Process 실행기).
# 파일 이름은 main_<namespace>.<id>.yml. v2.0.9 파일 감시는 파일명의 첫 '_' 앞을 테넌트로 읽는다(FileChangedEventListener).
id: gerrit
namespace: dataflow.ingest

labels:
  system.readOnly: "false"   # 잠금 설정 1. "true"면 화면 편집 잠금(ADR-0005)

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  # B1·B2: 폴더는 예정 시각(trigger.date, 없으면 실행 시각), 파일명은 실제 실행 시각 + 실행 ID. 모두 UTC.
  - id: keys
    type: io.kestra.plugin.core.output.OutputValues
    values:
      partition: "dt={{ (trigger.date ?? execution.startDate) | date('yyyy-MM-dd', timeZone='UTC') }}/hr={{ (trigger.date ?? execution.startDate) | date('HH', timeZone='UTC') }}"
      file: "{{ execution.startDate | date('yyyyMMdd', timeZone='UTC') }}T{{ execution.startDate | date('HHmmss', timeZone='UTC') }}Z_{{ execution.id }}"
      scheduled_at: "{{ (trigger.date ?? execution.startDate) | date('iso', timeZone='UTC') }}"

  - id: fetch
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      GERRIT_URL: "{{ kv('GERRIT_URL') }}"
      GERRIT_PAGE_SIZE: "{{ kv('GERRIT_PAGE_SIZE', errorOnMissing=false) ?? '100' }}"
      # 값이 아니라 경로를 넘긴다. 스크립트가 실행마다 읽으므로 재기동 없이 교체된다(IR4).
      GERRIT_USERNAME_FILE: /run/secrets/GERRIT_USERNAME
      GERRIT_PASSWORD_FILE: /run/secrets/GERRIT_PASSWORD
    commands:
      - python /app/ingest/scripts/gerrit/gerrit.py --out-dir .
    outputFiles:
      - account.jsonl
      - project.jsonl
      - group.jsonl
    retry:   # IR6: 지수 간격, 최대 3번, 총 10분
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 3
      maxDuration: PT10M

  # IR9: 세 스트림을 모두 받은 뒤에 올린다.
  - id: upload_account
    type: io.kestra.plugin.aws.s3.Upload
    bucket: "{{ kv('S3_BUCKET') }}"
    endpointOverride: "{{ kv('S3_ENDPOINT') }}"
    forcePathStyle: true
    compatibilityMode: true   # v2.0.9 aws 플러그인은 forcePathStyle에 compatibilityMode를 요구(전송 약 2GB 한도)
    region: "{{ kv('S3_REGION', errorOnMissing=false) ?? 'us-east-1' }}"
    # read() 값은 secret()과 달리 로그 마스킹 대상이 아니다. 로그·출력에 남기지 않는다.
    accessKeyId: "{{ read('file:///run/secrets/S3_ACCESS_KEY_ID') | trim }}"
    secretKeyId: "{{ read('file:///run/secrets/S3_SECRET_KEY_ID') | trim }}"
    from: "{{ outputs.fetch.outputFiles['account.jsonl'] }}"
    key: "bronze/gerrit/account/{{ outputs.keys.values.partition }}/{{ outputs.keys.values.file }}.jsonl"
    retry:   # IR6: 지수 간격, 최대 3번, 총 10분
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 3
      maxDuration: PT10M
  - id: upload_project
    type: io.kestra.plugin.aws.s3.Upload
    bucket: "{{ kv('S3_BUCKET') }}"
    endpointOverride: "{{ kv('S3_ENDPOINT') }}"
    forcePathStyle: true
    compatibilityMode: true   # v2.0.9 aws 플러그인은 forcePathStyle에 compatibilityMode를 요구(전송 약 2GB 한도)
    region: "{{ kv('S3_REGION', errorOnMissing=false) ?? 'us-east-1' }}"
    # read() 값은 secret()과 달리 로그 마스킹 대상이 아니다. 로그·출력에 남기지 않는다.
    accessKeyId: "{{ read('file:///run/secrets/S3_ACCESS_KEY_ID') | trim }}"
    secretKeyId: "{{ read('file:///run/secrets/S3_SECRET_KEY_ID') | trim }}"
    from: "{{ outputs.fetch.outputFiles['project.jsonl'] }}"
    key: "bronze/gerrit/project/{{ outputs.keys.values.partition }}/{{ outputs.keys.values.file }}.jsonl"
    retry:   # IR6: 지수 간격, 최대 3번, 총 10분
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 3
      maxDuration: PT10M
  - id: upload_group
    type: io.kestra.plugin.aws.s3.Upload
    bucket: "{{ kv('S3_BUCKET') }}"
    endpointOverride: "{{ kv('S3_ENDPOINT') }}"
    forcePathStyle: true
    compatibilityMode: true   # v2.0.9 aws 플러그인은 forcePathStyle에 compatibilityMode를 요구(전송 약 2GB 한도)
    region: "{{ kv('S3_REGION', errorOnMissing=false) ?? 'us-east-1' }}"
    # read() 값은 secret()과 달리 로그 마스킹 대상이 아니다. 로그·출력에 남기지 않는다.
    accessKeyId: "{{ read('file:///run/secrets/S3_ACCESS_KEY_ID') | trim }}"
    secretKeyId: "{{ read('file:///run/secrets/S3_SECRET_KEY_ID') | trim }}"
    from: "{{ outputs.fetch.outputFiles['group.jsonl'] }}"
    key: "bronze/gerrit/group/{{ outputs.keys.values.partition }}/{{ outputs.keys.values.file }}.jsonl"
    retry:   # IR6: 지수 간격, 최대 3번, 총 10분
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 3
      maxDuration: PT10M

# 감시 흐름(dataflow.system.ingest_watch)이 예정 시각을 기록할 수 있게 내보낸다.
outputs:
  - id: scheduled_at
    type: STRING
    value: "{{ outputs.keys.values.scheduled_at }}"

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: UTC

