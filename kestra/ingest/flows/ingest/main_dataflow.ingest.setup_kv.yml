# 수집 설정값(KV)을 넣고 바꾸는 흐름. 운영자가 화면에서 입력값만 바꿔 실행한다. ADR: docs/adr/airbyte/0005
# 기본값은 로컬 compose(목 서버, SeaweedFS S3, compose postgres) 기준이다. 비밀값은 여기 넣지 않는다(secrets/<KEY> 파일).
# 감시 흐름에 걸리지 않게 감시 흐름은 이 흐름을 건너뛴다.
id: setup_kv
namespace: dataflow.ingest

inputs:
  - id: gerrit_url
    type: STRING
    defaults: http://mock-gerrit:8080
  - id: gerrit_page_size
    type: INT
    defaults: 100
  - id: ghes_base_url
    type: STRING
    defaults: http://mock-ghes:8080
  - id: pg_url
    type: STRING
    defaults: jdbc:postgresql://postgres:5432/source_users
  - id: pg_table
    type: STRING
    defaults: public.users
  - id: s3_endpoint
    type: STRING
    defaults: http://s3:8333
  - id: s3_bucket
    type: STRING
    defaults: dataflow-bronze
  - id: s3_region
    type: STRING
    defaults: us-east-1
  - id: ops_pg_url
    type: STRING
    defaults: jdbc:postgresql://postgres:5432/ingest_ops

tasks:
  - id: gerrit_url
    type: io.kestra.plugin.core.kv.Set
    key: GERRIT_URL
    value: "{{ inputs.gerrit_url }}"
  - id: gerrit_page_size
    type: io.kestra.plugin.core.kv.Set
    key: GERRIT_PAGE_SIZE
    value: "{{ inputs.gerrit_page_size }}"
  - id: ghes_base_url
    type: io.kestra.plugin.core.kv.Set
    key: GHES_BASE_URL
    value: "{{ inputs.ghes_base_url }}"
  - id: pg_url
    type: io.kestra.plugin.core.kv.Set
    key: PG_URL
    value: "{{ inputs.pg_url }}"
  - id: pg_table
    type: io.kestra.plugin.core.kv.Set
    key: PG_TABLE
    value: "{{ inputs.pg_table }}"
  - id: s3_endpoint
    type: io.kestra.plugin.core.kv.Set
    key: S3_ENDPOINT
    value: "{{ inputs.s3_endpoint }}"
  - id: s3_bucket
    type: io.kestra.plugin.core.kv.Set
    key: S3_BUCKET
    value: "{{ inputs.s3_bucket }}"
  - id: s3_region
    type: io.kestra.plugin.core.kv.Set
    key: S3_REGION
    value: "{{ inputs.s3_region }}"
  - id: ops_pg_url
    type: io.kestra.plugin.core.kv.Set
    namespace: dataflow.system
    key: OPS_PG_URL
    value: "{{ inputs.ops_pg_url }}"
