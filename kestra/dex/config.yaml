# 검증용 IdP. 운영 IdP 로 교체하면 oauth2-proxy 의 issuerURL/client 만 바뀐다.
issuer: http://dex.localtest.me:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: kestra
    name: Kestra
    secret: kestra-oidc-secret
    redirectURIs:
      - http://kestra.localtest.me:4180/oauth2/callback

enablePasswordDB: true

# 비밀번호는 둘 다 "password" (dex 예제의 bcrypt 해시)
staticPasswords:
  - email: alice@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: alice
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
  - email: bob@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: bob
    userID: 41331323-6f44-45e6-b3b9-2c4b60c02be5
